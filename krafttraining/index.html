<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101418" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kraft">
<title>Krafttraining</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Cpath d='M14 26v12M20 20v24M44 20v24M50 26v12M20 32h24' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --text: #1b1f24; --muted: #66707c;
  --line: #d9dee4; --field: #f4f5f7; --accent: #0f766e; --on-accent: #ffffff;
  --tint: #e3f2f0; --danger: #b42318; --shadow: 0 1px 2px rgba(0,0,0,.06);
  --track: #c4ccd4; --track-edge: #9aa5b0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101418; --card: #1a2027; --text: #e8ecf0; --muted: #98a2ae;
    --line: #2d3640; --field: #12171c; --accent: #2dd4bf; --on-accent: #04201d;
    --tint: #17302e; --danger: #ff8a80; --shadow: none;
    --track: #3a4652; --track-edge: #55626f;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
}
main { max-width: 560px; margin: 0 auto; padding-top: 16px; }
h1 { font-size: 28px; margin: 8px 0 4px; letter-spacing: -.01em; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 8px; font-weight: 600; }
p { margin: 0 0 12px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
a { color: var(--accent); }
.back { display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; font-weight: 600; margin-left: -4px; }

button, .btn {
  font: inherit; font-weight: 600; min-height: 52px; padding: 0 20px; border-radius: 14px; border: 0;
  background: var(--accent); color: var(--on-accent); cursor: pointer; width: 100%;
  display: flex; align-items: center; justify-content: center; text-align: center; text-decoration: none;
}
button.secondary, .btn.secondary { background: var(--card); color: var(--text); border: 1.5px solid var(--line); }
button.danger { background: var(--card); color: var(--danger); border: 1.5px solid var(--line); }
button.small-btn { min-height: 44px; font-size: 15px; padding: 0 14px; width: auto; }
button:active { opacity: .8; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.plans { display: grid; gap: 14px; margin-top: 20px; }
.plan {
  display: block; text-decoration: none; color: var(--text); background: var(--card);
  border-radius: 20px; padding: 26px 22px; box-shadow: var(--shadow); border: 1.5px solid var(--line);
}
.plan b { display: block; font-size: 26px; }
.plan span { color: var(--muted); font-size: 15px; }
.plan:active { transform: scale(.99); }

.list { background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; overflow: hidden; }
.list a { display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 8px 16px; color: var(--text); text-decoration: none; border-top: 1px solid var(--line); }
.list a:first-child { border-top: 0; }
.list a span { color: var(--muted); font-size: 14px; }

.card { background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 16px; margin: 14px 0; box-shadow: var(--shadow); }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.card h3 { margin: 0; font-size: 20px; }
.spec { color: var(--muted); font-size: 14px; }
.hist-link { font-size: 15px; font-weight: 600; text-decoration: none; min-height: 44px; display: inline-flex; align-items: center; white-space: nowrap; }
.last { font-size: 14px; color: var(--muted); margin: 8px 0 10px; }
.suggest { background: var(--tint); border-radius: 12px; padding: 10px 12px; margin: 0 0 12px; font-size: 15px; }
.suggest b { display: block; }
.suggest button { margin-top: 8px; min-height: 44px; font-size: 15px; }
.rows { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: 52px 1fr 1fr; gap: 8px; align-items: center; }
.row.single { grid-template-columns: 52px 1fr; }
.row .n { color: var(--muted); font-size: 14px; }
.cols { display: grid; grid-template-columns: 52px 1fr 1fr; gap: 8px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; text-align: center; }
.cols.single { grid-template-columns: 52px 1fr; }
input[type=text], input[type=date] {
  width: 100%; min-height: 54px; font: inherit; font-size: 20px; text-align: center; color: var(--text);
  background: var(--field); border: 1.5px solid var(--line); border-radius: 12px; padding: 0 8px;
}
input.bad { border-color: var(--danger); }
input::placeholder { color: var(--muted); opacity: .55; }
.tools { display: flex; gap: 8px; margin-top: 10px; }
.tools button { flex: 1; }

.datebar { display: flex; align-items: center; gap: 12px; margin: 8px 0; }
.datebar label { font-size: 15px; color: var(--muted); }
.datebar input { max-width: 190px; font-size: 17px; }

.savebar { position: sticky; bottom: 0; padding: 14px 0 calc(8px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, transparent); margin-top: 8px; }

table { width: 100%; border-collapse: collapse; font-size: 16px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 8px 6px; }
td { padding: 12px 6px; border-top: 1px solid var(--line); vertical-align: middle; }
td.x { width: 48px; text-align: right; padding-right: 0; }
td.x button { min-height: 44px; width: 44px; padding: 0; background: transparent; color: var(--muted); font-size: 20px; }
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot { fill: var(--card); stroke: var(--accent); stroke-width: 2.5; }
.chart text { fill: var(--muted); font-size: 10.5px; }
.chart text.val { fill: var(--text); font-weight: 600; }

.toast {
  position: fixed; left: 16px; right: 16px; bottom: calc(24px + env(safe-area-inset-bottom)); max-width: 528px; margin: 0 auto;
  background: var(--text); color: var(--bg); padding: 14px 16px; border-radius: 14px; font-weight: 600; text-align: center;
  opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; pointer-events: none; z-index: 10;
}
.toast.show { opacity: 1; transform: none; }
select, textarea { width: 100%; font: inherit; font-size: 17px; color: var(--text); background: var(--field); border: 1.5px solid var(--line); border-radius: 12px; padding: 0 12px; }
select { min-height: 54px; }
textarea { padding: 12px; font-size: 15px; line-height: 1.45; resize: vertical; }
.stack { display: grid; gap: 10px; }
.map { background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; overflow: hidden; }
.map svg { display: block; width: 100%; height: auto; }
.map .edge { fill: none; stroke: var(--track-edge); stroke-width: 36; stroke-linecap: round; stroke-linejoin: round; }
.map .road { fill: none; stroke: var(--track); stroke-width: 30; stroke-linecap: round; stroke-linejoin: round; }
.map .mid { fill: none; stroke: var(--card); stroke-opacity: .75; stroke-width: 2; stroke-dasharray: 8 9; }
.map .stn { cursor: pointer; }
.map .stn circle { fill: var(--card); stroke: var(--accent); stroke-width: 3; transition: fill .25s; }
.map .stn text { fill: var(--text); font-size: 14px; font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.map .stn.seen circle { fill: var(--accent); }
.map .stn.seen text { fill: var(--on-accent); }
.map .stn.now circle { stroke-width: 5; }
.map .name { fill: var(--text); font-size: 13px; font-weight: 700; text-anchor: middle; paint-order: stroke; stroke: var(--card); stroke-width: 4px; stroke-linejoin: round; }
.map .tag { fill: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; }
.kart .body { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
.kart .wheel { fill: var(--text); }
.kart .glass { fill: var(--card); opacity: .85; }
.pv-card { margin: 12px 0; min-height: 132px; }
.pv-card h3 { margin: 0 0 2px; font-size: 20px; }
.pv-ctrl { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 10px; margin: 10px 0 14px; }
.pv-ctrl button { font-size: 22px; }
.pv-dots { text-align: center; color: var(--muted); font-size: 14px; margin-top: 6px; }
@media (prefers-reduced-motion: no-preference) { .map .stn.now circle { animation: pulse 1.1s ease-in-out infinite alternate; transform-origin: center; transform-box: fill-box; } }
@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.18); } }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 10px; }
.seg button { width: auto; min-height: 44px; min-width: 76px; padding: 0 16px; border-radius: 0; background: var(--field); color: var(--muted); font-size: 15px; }
.seg button.on { background: var(--accent); color: var(--on-accent); }
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ---------- Plan ---------- */
// kind: normal | assist (Wert = Unterstützung) | time (Sekunden) | bw (Körpergewicht, Zusatzgewicht optional)
const EXERCISES = {
  klimm:  { name: "Klimmzug-Maschine",          sets: 3, min: 6,  max: 10, kind: "assist" },
  bein:   { name: "Beinpresse",                 sets: 3, min: 10, max: 12, kind: "normal" },
  kabel:  { name: "Rudern am Kabelturm",        sets: 3, min: 10, max: 12, kind: "normal" },
  face:   { name: "Face Pulls",                 sets: 3, min: 12, max: 15, kind: "normal" },
  hollow: { name: "Hollow Hold",                sets: 3, min: 20, max: 30, kind: "time" },
  latzug: { name: "Latzug",                     sets: 3, min: 8,  max: 12, kind: "normal" },
  curl:   { name: "Beinbeuger-Maschine",        sets: 3, min: 10, max: 12, kind: "normal" },
  ruder:  { name: "Rudermaschine (Brustpolster)", sets: 3, min: 10, max: 12, kind: "normal" },
  rot:    { name: "Außenrotation",              sets: 2, min: 12, max: 15, kind: "normal", note: "pro Seite" },
  heben:  { name: "Beinheben",                  sets: 3, min: 8,  max: 12, kind: "bw" }
};
const PLANS = {
  A: { name: "Einheit A", ids: ["klimm", "bein", "kabel", "face", "hollow"] },
  B: { name: "Einheit B", ids: ["latzug", "curl", "ruder", "rot", "heben"] }
};

/* ---------- Hilfsfunktionen ---------- */
const KEY = "krafttraining-v1", DKEY = "krafttraining-draft-v1";
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const round = n => Math.round(n * 100) / 100;
const fmt = n => round(n).toLocaleString("de-DE", { maximumFractionDigits: 2 });
const fmt1 = n => (Math.round(n * 10) / 10).toLocaleString("de-DE", { maximumFractionDigits: 1 });
const toInput = n => String(round(n)).replace(".", ",");
function today() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
const dmy = s => s.slice(8, 10) + "." + s.slice(5, 7) + "." + s.slice(0, 4);
const dm = s => s.slice(8, 10) + "." + s.slice(5, 7) + ".";
// "" -> null (leer), ungültig -> NaN, sonst Zahl (Komma oder Punkt)
function parseNum(s) {
  s = String(s).trim().replace(",", ".");
  if (s === "") return null;
  return /^\d+(\.\d+)?$/.test(s) ? Number(s) : NaN;
}
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    e.append(c instanceof Node ? c : String(c));
  }
  return e;
}
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ---------- Speicher ---------- */
let memoryOnly = false;
function store(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (e) { memoryOnly = true; return false; }
}
function sanitize(d) {
  const out = [];
  const list = d && Array.isArray(d.sessions) ? d.sessions : [];
  for (const s of list) {
    if (!s || !DATE_RE.test(s.date) || !PLANS[s.plan] || typeof s.entries !== "object" || !s.entries) continue;
    const entries = {};
    for (const [id, sets] of Object.entries(s.entries)) {
      if (!EXERCISES[id] || !Array.isArray(sets)) continue;
      const clean = sets
        .map(x => ({ w: Number(x && x.w), r: Number(x && x.r) }))
        .filter(x => isFinite(x.w) && isFinite(x.r) && x.w >= 0 && x.r > 0);
      if (clean.length) entries[id] = clean;
    }
    if (!Object.keys(entries).length) continue;
    const units = {};
    for (const id of Object.keys(entries)) if (s.units && s.units[id] === "st") units[id] = "st";
    out.push({ date: s.date, plan: s.plan, entries, units });
  }
  return { sessions: out, units: d && d.units && typeof d.units === "object" ? Object.fromEntries(Object.entries(d.units).filter(([k, v]) => EXERCISES[k] && v === "st")) : {} };
}
function loadDb() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw !== null) return sanitize(JSON.parse(raw));
  } catch (e) { memoryOnly = true; }
  // Erster Start: Startdaten
  const seed = { sessions: [{ date: today(), plan: "A", entries: { klimm: [{ w: 21, r: 10 }, { w: 21, r: 10 }, { w: 21, r: 8.5 }] }, units: {} }], units: {} };
  store(KEY, seed);
  return seed;
}
let db = loadDb();
const persist = () => store(KEY, db);

let drafts = {};
try { drafts = JSON.parse(localStorage.getItem(DKEY)) || {}; } catch (e) { drafts = {}; }

/* ---------- Maßeinheit (kg oder Maschinen-Stufe) ---------- */
const curUnit = id => (db.units && db.units[id]) === "st" ? "st" : "kg";
const unitName = (u, n) => u === "st" ? (n === 1 ? "Stufe" : "Stufen") : "kg";

/* ---------- Auswertung ---------- */
function sortedSessions() {
  return db.sessions.map((s, i) => [s, i]).sort((a, b) => a[0].date.localeCompare(b[0].date) || a[1] - b[1]).map(x => x[0]);
}
// Letzte Einheit mit dieser Übung (nicht am selben Tag derselben Einheit, nicht in der Zukunft)
function lastFor(id, date, plan) {
  let found = null;
  for (const s of sortedSessions()) {
    if (!s.entries[id] || s.date > date || (s.date === date && s.plan === plan)) continue;
    found = { date: s.date, sets: s.entries[id], unit: s.units && s.units[id] === "st" ? "st" : "kg" };
  }
  return found;
}
function lastText(ex, last) {
  const s = last.sets, reps = s.map(x => fmt(x.r)).join(" / ");
  if (ex.kind === "time") return reps + " Sek.";
  const ws = s.map(x => x.w), same = ws.every(w => w === ws[0]);
  const un = unitName(last.unit, same ? ws[0] : 2);
  if (!same) return s.map(x => fmt(x.w) + "×" + fmt(x.r)).join(" · ") + " (" + un + " × Wdh.)";
  if (ex.kind === "bw" && ws[0] === 0) return reps + " Wdh.";
  const unit = ex.kind === "assist" ? un + " Unterstützung" : ex.kind === "bw" ? un + " zusätzlich" : un;
  return fmt(ws[0]) + " " + unit + " · " + reps + " Wdh.";
}
function suggestion(ex, last, cur) {
  if (!last || last.unit !== cur || last.sets.length < ex.sets || !last.sets.every(s => s.r >= ex.max)) return null;
  if (ex.kind === "time")
    return { title: "Alle Sätze mit " + ex.max + " Sek. geschafft", text: "Nächste Stufe: länger halten oder die Position erschweren.", fill: null };
  const ws = last.sets.map(s => s.w), kg = last.unit === "kg";
  if (ex.kind === "assist") {
    const base = Math.min(...ws), lo = Math.max(0, round(base - (kg ? 3 : 1))), hi = Math.max(0, round(base - (kg ? 2 : 1)));
    const un = unitName(last.unit, lo === hi ? hi : 2);
    return { title: "Vorschlag heute: " + (lo === hi ? fmt(hi) : fmt(lo) + "–" + fmt(hi)) + " " + un + " Unterstützung",
             text: (kg ? "2–3 kg" : "1 Stufe") + " weniger als zuletzt – alle Sätze mit " + ex.max + " Wdh. geschafft.", fill: hi };
  }
  const step = kg ? 2.5 : 1, base = Math.max(...ws), fill = round(base + step), un = unitName(last.unit, fill);
  return { title: "Vorschlag heute: " + fmt(fill) + " " + un + (ex.kind === "bw" ? " zusätzlich" : ""),
           text: "+" + fmt(step) + " " + unitName(last.unit, step) + " – alle Sätze mit " + ex.max + " Wdh. geschafft.", fill };
}

/* ---------- Ansichten ---------- */
const app = document.getElementById("app");
const backLink = (href, label) => h("a", { class: "back", href }, "‹ " + (label || "Zurück"));

function viewHome() {
  const sessions = sortedSessions();
  const planBtn = key => {
    const last = sessions.filter(s => s.plan === key).pop();
    return h("a", { class: "plan", href: "#/plan/" + key },
      h("b", null, PLANS[key].name),
      h("span", null, PLANS[key].ids.length + " Übungen" + (last ? " · zuletzt " + dmy(last.date) : " · noch nicht trainiert")));
  };
  const exLinks = key => h("div", { class: "list" }, PLANS[key].ids.map(id => {
    const n = sessions.filter(s => s.entries[id]).length;
    return h("a", { href: "#/ex/" + id }, EXERCISES[id].name, h("span", null, n + "×"));
  }));
  return h("div", null,
    h("h1", null, "Krafttraining"),
    h("p", { class: "muted" }, "Welche Einheit steht heute an?"),
    h("div", { class: "plans" }, planBtn("A"), planBtn("B")),
    h("div", { class: "pv-ctrl", style: "grid-template-columns:1fr 1fr;margin-bottom:0" },
      h("a", { class: "btn secondary", href: "#/vorschau/A", style: "font-size:15px" }, "▶ Vorschau A"),
      h("a", { class: "btn secondary", href: "#/vorschau/B", style: "font-size:15px" }, "▶ Vorschau B")),
    h("h2", null, "Verlauf · Einheit A"), exLinks("A"),
    h("h2", null, "Verlauf · Einheit B"), exLinks("B"),
    h("h2", null, "Daten"),
    h("a", { class: "btn secondary", href: "#/daten" }, "Export / Import (Backup)"),
    memoryOnly ? h("p", { class: "small", style: "color:var(--danger);margin-top:12px" }, "Achtung: Der Browser erlaubt kein Speichern (privater Modus?). Daten gehen beim Schließen verloren.") : null);
}

function viewPlan(key) {
  const plan = PLANS[key];
  const draft = drafts[key] = drafts[key] || { date: today(), entries: {} };
  const saveDraft = () => { store(DKEY, drafts); };
  const dateIn = h("input", { type: "date", value: draft.date, "aria-label": "Datum", onchange: () => { if (DATE_RE.test(dateIn.value)) { draft.date = dateIn.value; saveDraft(); route(); } } });
  const refs = {}; // id -> [{w, r}] Eingabefelder

  const cards = plan.ids.map(id => {
    const ex = EXERCISES[id], noW = ex.kind === "time";
    const cur = curUnit(id), last = lastFor(id, draft.date, key), sug = suggestion(ex, last, cur), sameUnit = !!last && last.unit === cur;
    const saved = draft.entries[id] || [];
    refs[id] = [];
    const sync = () => { draft.entries[id] = refs[id].map(r => [r.w ? r.w.value : "", r.r.value]); saveDraft(); };
    const rows = [];
    for (let i = 0; i < ex.sets; i++) {
      const lastSet = sameUnit && (last.sets[i] || last.sets[last.sets.length - 1]);
      const field = (ph, v, label) => h("input", { type: "text", inputmode: "decimal", autocomplete: "off", enterkeyhint: "next", placeholder: ph, value: v || "", "aria-label": label + " Satz " + (i + 1) + ", " + ex.name, oninput: e => { e.target.classList.remove("bad"); sync(); } });
      const ref = {};
      if (!noW) ref.w = field(lastSet ? toInput(lastSet.w) : unitName(cur), saved[i] && saved[i][0], "Gewicht");
      ref.r = field(sameUnit && last.sets[i] ? toInput(last.sets[i].r) : (noW ? "Sek." : "Wdh."), saved[i] && saved[i][1], noW ? "Sekunden" : "Wiederholungen");
      refs[id].push(ref);
      rows.push(h("div", { class: "row" + (noW ? " single" : "") }, h("span", { class: "n" }, "Satz " + (i + 1)), ref.w, ref.r));
    }
    const wLabel = (ex.kind === "assist" ? "Unterstützung " : ex.kind === "bw" ? "Zusatz " : "Gewicht ") + (cur === "st" ? "(Stufe)" : "kg");

/* ---------- Streckenvorschau (Überflug wie bei Mario Kart) ---------- */
function viewPreview(key) {

  const defs = mk("defs", {});

  chk.append(mk("rect", { width: 12, height: 12, fill: "#fff" }), mk("rect", { width: 6, height: 6, fill: "#111" }), mk("rect", { x: 6, y: 6, width: 6, height: 6, fill: "#111" }));
  defs.append(chk); svg.append(defs);
  const road = mk("path", { class: "road", d: dFull });
  svg.append(mk("path", { class: "edge", d: dFull }), road, mk("path", { class: "mid", d: dFull }));
  svg.append(mk("rect", { x: pts[0].x - 18, y: 24, width: 36, height: 5, rx: 2, fill: "var(--text)" }), mk("text", { class: "tag", x: pts[0].x + 26, y: 31 }, "START"));
  svg.append(mk("rect", { x: last.x - 24, y: endY - 2, width: 48, height: 12, rx: 2, fill: "url(#chk" + key + ")", stroke: "var(--text)", "stroke-width": 1 }), mk("text", { class: "tag", x: last.x, y: endY + 28, "text-anchor": "middle" }, "ZIEL"));
  const stns = pts.map((p, i) => {
    const g = mk("g", { class: "stn", tabindex: 0, role: "button", "aria-label": "Station " + (i + 1) + ": " + EXERCISES[ids[i]].name });
    g.append(mk("circle", { cx: p.x, cy: p.y, r: 17 }), mk("text", { x: p.x, y: p.y }, String(i + 1)));
    g.addEventListener("click", () => { pause(); goTo(i); });
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pause(); goTo(i); } });
    svg.append(g); return g;
  });
  const nameTxt = mk("text", { class: "name", x: 0, y: 0 }, "");
  const kart = mk("g", { class: "kart" });
  kart.append(mk("rect", { class: "wheel", x: -9, y: -9, width: 7, height: 4, rx: 1 }), mk("rect", { class: "wheel", x: -9, y: 5, width: 7, height: 4, rx: 1 }),
    mk("rect", { class: "wheel", x: 4, y: -9, width: 7, height: 4, rx: 1 }), mk("rect", { class: "wheel", x: 4, y: 5, width: 7, height: 4, rx: 1 }),
    mk("rect", { class: "body", x: -11, y: -6, width: 24, height: 12, rx: 5 }), mk("rect", { class: "glass", x: 1, y: -4, width: 6, height: 8, rx: 2 }));
  svg.append(nameTxt, kart);

  // Beschreibung der Stationen
  const info = ids.map(id => {
    const ex = EXERCISES[id], noW = ex.kind === "time", lst = lastFor(id, "9999-12-31", key), sug = suggestion(ex, lst, curUnit(id));
    return { name: ex.name, spec: ex.sets + " × " + ex.min + "–" + ex.max + (noW ? " Sek." : " Wdh.") + (ex.note ? " " + ex.note : ""),
             last: lst ? "Letztes Mal (" + dmy(lst.date) + "): " + lastText(ex, lst) : "Noch keine Einträge – das wird dein Startwert.", sug };
  });

  const card = h("section", { class: "card pv-card", "aria-live": "polite" });
  const dots = h("div", { class: "pv-dots" });
  const playBtn = h("button", { type: "button", "aria-label": "Überflug starten oder pausieren" }, "▶");
  const prevBtn = h("button", { type: "button", class: "secondary", "aria-label": "Vorherige Station" }, "‹");
  const nextBtn = h("button", { type: "button", class: "secondary", "aria-label": "Nächste Station" }, "›");
  const root = h("div", null,
    backLink("#/plan/" + key, plan.name),
    h("h1", null, "Streckenvorschau"),
    h("p", { class: "muted" }, plan.name + " · " + n + " Stationen"),
    h("div", { class: "map" }, svg), card, h("div", { class: "pv-ctrl" }, prevBtn, playBtn, nextBtn), dots,
    h("div", { class: "savebar" }, h("a", { class: "btn", href: "#/plan/" + key }, plan.name + " starten")));

  let pos = 0, cum = [], total = 0, idx = -1, playing = !reduce, raf = 0, timer = 0, ready = false;
  const alive = () => root.isConnected;
  function pause() { playing = false; clearTimeout(timer); playBtn.textContent = "▶"; }
  function paint(len, stop) {
    const p = road.getPointAtLength(len), a = road.getPointAtLength(Math.max(0, len - 2)), b = road.getPointAtLength(Math.min(total, len + 2));
    kart.setAttribute("transform", "translate(" + p.x + " " + p.y + ") rotate(" + (Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI) + ")");
    const cy = Math.max(0, Math.min(totalH - VH, p.y - VH * 0.45));
    svg.setAttribute("viewBox", "0 " + cy + " " + W + " " + VH);
  }
  function show(i) {
    idx = i;
    stns.forEach((g, k) => { g.classList.toggle("seen", k <= i); g.classList.toggle("now", k === i); });
    dots.textContent = i < n ? "Station " + (i + 1) + " von " + n : "Ziel";
    if (i < n) {
      const t = info[i];
      nameTxt.textContent = t.name; nameTxt.setAttribute("x", pts[i].x); nameTxt.setAttribute("y", pts[i].y - 28);
      card.replaceChildren(h("h3", null, (i + 1) + " · " + t.name), h("div", { class: "spec" }, t.spec), h("div", { class: "last" }, t.last),
        ...(t.sug ? [h("div", { class: "suggest", style: "margin:0" }, h("b", null, t.sug.title), t.sug.text)] : []));
    } else {
      nameTxt.textContent = "";
      card.replaceChildren(h("h3", null, "🏁 Ziel!"), h("div", { class: "spec" }, "Alle " + n + " Übungen im Blick."), h("div", { class: "last" }, "Bereit? Dann starte die Einheit."));
    }

  }
  function goTo(i) {
    cancelAnimationFrame(raf); clearTimeout(timer);
    i = Math.max(0, Math.min(n, i));
    const from = pos, to = cum[i], dur = reduce ? 0 : Math.max(450, Math.abs(to - from) * 3.2);
    nameTxt.textContent = "";
    const t0 = performance.now();
    const step = now => {
      if (!alive()) return;
      const k = dur === 0 ? 1 : Math.min(1, (now - t0) / dur), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      pos = from + (to - from) * e; paint(pos);

    };
    raf = requestAnimationFrame(step);
  }
  playBtn.addEventListener("click", () => {
    if (playing) { pause(); return; }
    playing = true; playBtn.textContent = "❚❚";
    goTo(idx >= n ? 0 : idx + 1);
  });
  prevBtn.addEventListener("click", () => { pause(); goTo(idx - 1); });
  nextBtn.addEventListener("click", () => { pause(); goTo(idx + 1); });
  prevBtn.disabled = true;

  setTimeout(() => { // Längen messen, sobald die Ansicht im DOM hängt
    if (!alive()) return;
    total = road.getTotalLength();
    const tmp = mk("path", {}); svg.append(tmp);
    cum = pts.map((p, i) => { tmp.setAttribute("d", dTo(i)); return tmp.getTotalLength(); }); cum.push(total);
    tmp.remove(); ready = true;

    else { playBtn.textContent = "▶"; }
  }, 0);
  return root;
}

function lineChart(points, unitLabel) {
  const NS = "http://www.w3.org/2000/svg";
  const W = 340, H = 190, L = 44, R = 16, T = 20, B = 28;
  const mk = (n, a, text) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (text != null) e.textContent = text; return e; };
  const svg = mk("svg", { viewBox: "0 0 " + W + " " + H, class: "chart", role: "img", "aria-label": "Liniendiagramm " + unitLabel });
  const vals = points.map(p => p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi) { lo -= 1; hi += 1; } else { const pad = (hi - lo) * 0.15; lo -= pad; hi += pad; }
  lo = Math.max(0, lo);
  const x = i => points.length === 1 ? L + (W - L - R) / 2 : L + i * (W - L - R) / (points.length - 1);
  const y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  [lo, (lo + hi) / 2, hi].forEach(v => {
    svg.append(mk("line", { class: "grid", x1: L, x2: W - R, y1: y(v), y2: y(v) }));
    svg.append(mk("text", { x: L - 6, y: y(v) + 3.5, "text-anchor": "end" }, fmt1(v)));
  });
  svg.append(mk("polyline", { class: "line", points: points.map((p, i) => x(i) + "," + y(p.v)).join(" ") }));
  points.forEach((p, i) => svg.append(mk("circle", { class: "dot", cx: x(i), cy: y(p.v), r: 4 })));
  const lastI = points.length - 1;
  svg.append(mk("text", { class: "val", x: Math.min(x(lastI), W - R - 8), y: y(points[lastI].v) - 10, "text-anchor": lastI === 0 ? "middle" : "end" }, fmt(points[lastI].v) + " " + unitLabel));
  const lab = (i, anchor) => svg.append(mk("text", { x: x(i), y: H - 8, "text-anchor": anchor }, dm(points[i].date)));
  if (points.length === 1) lab(0, "middle"); else { lab(0, "start"); lab(lastI, "end"); }
  return svg;
}

function viewExercise(id) {
  const ex = EXERCISES[id];
  if (!ex) return viewHome();
  const time = ex.kind === "time";
  const rows = sortedSessions().filter(s => s.entries[id]).map(s => ({ s, sets: s.entries[id] }));
  const chartUnit = time || !rows.length ? "kg" : unitOf(rows[rows.length - 1].s, id);
  const shown = rows.filter(r => time || unitOf(r.s, id) === chartUnit);
  const points = shown.map(r => ({ date: r.s.date, v: time ? Math.max(...r.sets.map(x => x.r)) : Math.max(...r.sets.map(x => x.w)) }));
  const unitLabel = time ? "Sek." : unitName(chartUnit);

  return h("div", null,
    backLink("#/", "Start"),

const unitOf = (s, id) => s.units && s.units[id] === "st" ? "st" : "kg";
function sessionText(s) {
  const lines = [PLANS[s.plan].name + " – " + dmy(s.date)];
  for (const id of PLANS[s.plan].ids) {
    if (!s.entries[id]) continue;
    const ex = EXERCISES[id];
    lines.push("- " + ex.name + (ex.note ? " (" + ex.note + ")" : "") + ": " + lastText(ex, { sets: s.entries[id], unit: unitOf(s, id) }));
  }
  return lines.join("\n");
}
function exerciseText(id) {
  const ex = EXERCISES[id], time = ex.kind === "time";
  const rows = sortedSessions().filter(s => s.entries[id]).map(s => ({ s, sets: s.entries[id], unit: unitOf(s, id) }));
  const head = ex.name + " – Verlauf (" + rows.length + " Einheit" + (rows.length === 1 ? "" : "en") + ", Ziel " + ex.sets + " × " + ex.min + "–" + ex.max + (time ? " Sek." : " Wdh.") + (ex.note ? " " + ex.note : "") + ")";
  const lines = [head].concat(rows.map(r => dmy(r.s.date) + ": " + lastText(ex, { sets: r.sets, unit: r.unit })));
  if (rows.length >= 2) {
    const a = rows[0], b = rows[rows.length - 1];
    const sign = d => (d > 0 ? "+" : d < 0 ? "−" : "±") + fmt(Math.abs(d));
    const sum = r => r.sets.reduce((t, x) => t + x.r, 0);
    lines.push("", "Vergleich " + dmy(a.s.date) + " → " + dmy(b.s.date) + ":");
    if (!time && a.unit === b.unit) {
      const wa = Math.max(...a.sets.map(x => x.w)), wb = Math.max(...b.sets.map(x => x.w));
      lines.push("- " + (ex.kind === "assist" ? "Unterstützung" : "Gewicht") + ": " + fmt(wa) + " → " + fmt(wb) + " " + unitName(b.unit, wb) + " (" + sign(wb - wa) + ")" + (ex.kind === "assist" ? " – weniger Unterstützung = besser" : ""));
    } else if (!time) lines.push("- Gewicht: nicht vergleichbar (Einheit gewechselt)");
    lines.push("- Wiederholungen gesamt: " + fmt(sum(a)) + " → " + fmt(sum(b)) + " (" + sign(sum(b) - sum(a)) + ")" + (time ? " Sek." : ""));
  }
  return lines.join("\n");
}
function copyBox(getText, hint) {

  const update = () => { ta.value = getText(); };
  const copy = async () => {
    update();
    try { await navigator.clipboard.writeText(ta.value); toast("Kopiert – jetzt im Chat einfügen"); }
    catch (e) { ta.focus(); ta.select(); toast("Text markiert – bitte manuell kopieren"); }
  };
  update();
  return { update, el: h("div", { class: "stack" }, hint ? h("p", { class: "small muted", style: "margin:0" }, hint) : null, ta, h("button", { type: "button", onclick: copy }, "Text kopieren")) };
}
function textExport() {
  const all = sortedSessions().reverse();
  if (!all.length) return h("p", { class: "muted" }, "Noch keine Einheiten gespeichert.");
  const ids = Object.keys(EXERCISES);
  const sel = h("select", { "aria-label": "Auswahl" },
    h("optgroup", { label: "Einzelne Einheit" }, all.map((s, i) => h("option", { value: "s" + i }, dmy(s.date) + " – " + PLANS[s.plan].name))),
    h("optgroup", { label: "Fortschritt einer Übung" }, ids.map(id => h("option", { value: "e" + id }, EXERCISES[id].name + " – Verlauf"))),
    h("optgroup", { label: "Alles" }, h("option", { value: "all" }, "Alle Einheiten (neueste zuerst)")));
  const build = () => {
    const v = sel.value;
    if (v === "all") return all.map(sessionText).join("\n\n");
    if (v[0] === "e") return exerciseText(v.slice(1));
    return sessionText(all[Number(v.slice(1))]);
  };
  const box = copyBox(build, "Wähle eine Einheit oder den Fortschritt einer Übung, kopiere den Text und füge ihn im Claude-Chat ein.");
  sel.addEventListener("change", box.update);
  return h("div", { class: "stack" }, sel, box.el);
}

function exportData() {
  const payload = { app: "krafttraining", version: 1, exported: new Date().toISOString(), sessions: sortedSessions() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = h("a", { href: url, download: "krafttraining-" + today() + ".json" });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  toast("Backup erstellt");
}
function importFile(file, input) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try { parsed = sanitize(JSON.parse(reader.result)); } catch (e) { toast("Datei konnte nicht gelesen werden"); input.value = ""; return; }
    if (!parsed.sessions.length) { toast("Keine gültigen Einheiten in der Datei"); input.value = ""; return; }
    if (!confirm(parsed.sessions.length + " Einheiten importieren? Einheiten mit gleichem Datum werden überschrieben.")) { input.value = ""; return; }
    const keys = new Set(parsed.sessions.map(s => s.date + s.plan));
    db.sessions = db.sessions.filter(s => !keys.has(s.date + s.plan)).concat(parsed.sessions);
    persist(); toast("Import abgeschlossen ✓"); route();
  };
  reader.onerror = () => toast("Datei konnte nicht gelesen werden");
  reader.readAsText(file);
}

/* ---------- Router ---------- */
function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/");
  let view;
  if (parts[0] === "plan" && PLANS[parts[1]]) view = viewPlan(parts[1]);
  else if (parts[0] === "vorschau" && PLANS[parts[1]]) view = viewPreview(parts[1]);
  else if (parts[0] === "ex" && EXERCISES[parts[1]]) view = viewExercise(parts[1]);
  else if (parts[0] === "daten") view = viewData();
  else view = viewHome();
  app.replaceChildren(view);
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();

    .forEach(l => { g.moveTo(l[0], l[1]); g.lineTo(l[2], l[3]); });
  g.stroke();
  document.head.append(h("link", { rel: "apple-touch-icon", href: c.toDataURL("image/png") }));
} catch (e) { /* Icon ist optional */ }
