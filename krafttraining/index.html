<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101418" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kraft">
<title>Krafttraining</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Cpath d='M14 26v12M20 20v24M44 20v24M50 26v12M20 32h24' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --text: #1b1f24; --muted: #66707c;
  --line: #d9dee4; --field: #f4f5f7; --accent: #0f766e; --on-accent: #ffffff;
  --tint: #e3f2f0; --danger: #b42318; --shadow: 0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101418; --card: #1a2027; --text: #e8ecf0; --muted: #98a2ae;
    --line: #2d3640; --field: #12171c; --accent: #2dd4bf; --on-accent: #04201d;
    --tint: #17302e; --danger: #ff8a80; --shadow: none;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
}
main { max-width: 560px; margin: 0 auto; padding-top: 16px; }
h1 { font-size: 28px; margin: 8px 0 4px; letter-spacing: -.01em; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 8px; font-weight: 600; }
p { margin: 0 0 12px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
a { color: var(--accent); }
.back { display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; font-weight: 600; margin-left: -4px; }

button, .btn {
  font: inherit; font-weight: 600; min-height: 52px; padding: 0 20px; border-radius: 14px; border: 0;
  background: var(--accent); color: var(--on-accent); cursor: pointer; width: 100%;
  display: flex; align-items: center; justify-content: center; text-align: center; text-decoration: none;
}
button.secondary, .btn.secondary { background: var(--card); color: var(--text); border: 1.5px solid var(--line); }
button.danger { background: var(--card); color: var(--danger); border: 1.5px solid var(--line); }
button.small-btn { min-height: 44px; font-size: 15px; padding: 0 14px; width: auto; }
button:active { opacity: .8; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.plans { display: grid; gap: 14px; margin-top: 20px; }
.plan {
  display: block; text-decoration: none; color: var(--text); background: var(--card);
  border-radius: 20px; padding: 26px 22px; box-shadow: var(--shadow); border: 1.5px solid var(--line);
}
.plan b { display: block; font-size: 26px; }
.plan span { color: var(--muted); font-size: 15px; }
.plan:active { transform: scale(.99); }

.list { background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; overflow: hidden; }
.list a { display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 8px 16px; color: var(--text); text-decoration: none; border-top: 1px solid var(--line); }
.list a:first-child { border-top: 0; }
.list a span { color: var(--muted); font-size: 14px; }

.card { background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 16px; margin: 14px 0; box-shadow: var(--shadow); }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.card h3 { margin: 0; font-size: 20px; }
.spec { color: var(--muted); font-size: 14px; }
.hist-link { font-size: 15px; font-weight: 600; text-decoration: none; min-height: 44px; display: inline-flex; align-items: center; white-space: nowrap; }
.last { font-size: 14px; color: var(--muted); margin: 8px 0 10px; }
.suggest { background: var(--tint); border-radius: 12px; padding: 10px 12px; margin: 0 0 12px; font-size: 15px; }
.suggest b { display: block; }
.suggest button { margin-top: 8px; min-height: 44px; font-size: 15px; }
.rows { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: 52px 1fr 1fr; gap: 8px; align-items: center; }
.row.single { grid-template-columns: 52px 1fr; }
.row .n { color: var(--muted); font-size: 14px; }
.cols { display: grid; grid-template-columns: 52px 1fr 1fr; gap: 8px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; text-align: center; }
.cols.single { grid-template-columns: 52px 1fr; }
input[type=text], input[type=date] {
  width: 100%; min-height: 54px; font: inherit; font-size: 20px; text-align: center; color: var(--text);
  background: var(--field); border: 1.5px solid var(--line); border-radius: 12px; padding: 0 8px;
}
input.bad { border-color: var(--danger); }
input::placeholder { color: var(--muted); opacity: .55; }
.tools { display: flex; gap: 8px; margin-top: 10px; }
.tools button { flex: 1; }

.datebar { display: flex; align-items: center; gap: 12px; margin: 8px 0; }
.datebar label { font-size: 15px; color: var(--muted); }
.datebar input { max-width: 190px; font-size: 17px; }

.savebar { position: sticky; bottom: 0; padding: 14px 0 calc(8px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, transparent); margin-top: 8px; }

table { width: 100%; border-collapse: collapse; font-size: 16px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 8px 6px; }
td { padding: 12px 6px; border-top: 1px solid var(--line); vertical-align: middle; }
td.x { width: 48px; text-align: right; padding-right: 0; }
td.x button { min-height: 44px; width: 44px; padding: 0; background: transparent; color: var(--muted); font-size: 20px; }
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot { fill: var(--card); stroke: var(--accent); stroke-width: 2.5; }
.chart text { fill: var(--muted); font-size: 10.5px; }
.chart text.val { fill: var(--text); font-weight: 600; }

.toast {
  position: fixed; left: 16px; right: 16px; bottom: calc(24px + env(safe-area-inset-bottom)); max-width: 528px; margin: 0 auto;
  background: var(--text); color: var(--bg); padding: 14px 16px; border-radius: 14px; font-weight: 600; text-align: center;
  opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; pointer-events: none; z-index: 10;
}
.toast.show { opacity: 1; transform: none; }
.stack { display: grid; gap: 10px; }
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ---------- Plan ---------- */
// kind: normal | assist (Wert = Unterstützung) | time (Sekunden) | bw (Körpergewicht, Zusatzgewicht optional)
const EXERCISES = {
  klimm:  { name: "Klimmzug-Maschine",          sets: 3, min: 6,  max: 10, kind: "assist" },
  bein:   { name: "Beinpresse",                 sets: 3, min: 10, max: 12, kind: "normal" },
  kabel:  { name: "Rudern am Kabelturm",        sets: 3, min: 10, max: 12, kind: "normal" },
  face:   { name: "Face Pulls",                 sets: 3, min: 12, max: 15, kind: "normal" },
  hollow: { name: "Hollow Hold",                sets: 3, min: 20, max: 30, kind: "time" },
  latzug: { name: "Latzug",                     sets: 3, min: 8,  max: 12, kind: "normal" },
  curl:   { name: "Beinbeuger-Maschine",        sets: 3, min: 10, max: 12, kind: "normal" },
  ruder:  { name: "Rudermaschine (Brustpolster)", sets: 3, min: 10, max: 12, kind: "normal" },
  rot:    { name: "Außenrotation",              sets: 2, min: 12, max: 15, kind: "normal", note: "pro Seite" },
  heben:  { name: "Beinheben",                  sets: 3, min: 8,  max: 12, kind: "bw" }
};
const PLANS = {
  A: { name: "Einheit A", ids: ["klimm", "bein", "kabel", "face", "hollow"] },
  B: { name: "Einheit B", ids: ["latzug", "curl", "ruder", "rot", "heben"] }
};

/* ---------- Hilfsfunktionen ---------- */
const KEY = "krafttraining-v1", DKEY = "krafttraining-draft-v1";
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const round = n => Math.round(n * 100) / 100;
const fmt = n => round(n).toLocaleString("de-DE", { maximumFractionDigits: 2 });
const fmt1 = n => (Math.round(n * 10) / 10).toLocaleString("de-DE", { maximumFractionDigits: 1 });
const toInput = n => String(round(n)).replace(".", ",");
function today() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
const dmy = s => s.slice(8, 10) + "." + s.slice(5, 7) + "." + s.slice(0, 4);
const dm = s => s.slice(8, 10) + "." + s.slice(5, 7) + ".";
// "" -> null (leer), ungültig -> NaN, sonst Zahl (Komma oder Punkt)
function parseNum(s) {
  s = String(s).trim().replace(",", ".");
  if (s === "") return null;
  return /^\d+(\.\d+)?$/.test(s) ? Number(s) : NaN;
}
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    e.append(c instanceof Node ? c : String(c));
  }
  return e;
}
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ---------- Speicher ---------- */
let memoryOnly = false;
function store(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (e) { memoryOnly = true; return false; }
}
function sanitize(d) {
  const out = [];
  const list = d && Array.isArray(d.sessions) ? d.sessions : [];
  for (const s of list) {
    if (!s || !DATE_RE.test(s.date) || !PLANS[s.plan] || typeof s.entries !== "object" || !s.entries) continue;
    const entries = {};
    for (const [id, sets] of Object.entries(s.entries)) {
      if (!EXERCISES[id] || !Array.isArray(sets)) continue;
      const clean = sets
        .map(x => ({ w: Number(x && x.w), r: Number(x && x.r) }))
        .filter(x => isFinite(x.w) && isFinite(x.r) && x.w >= 0 && x.r > 0);
      if (clean.length) entries[id] = clean;
    }
    if (Object.keys(entries).length) out.push({ date: s.date, plan: s.plan, entries });
  }
  return { sessions: out };
}
function loadDb() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw !== null) return sanitize(JSON.parse(raw));
  } catch (e) { memoryOnly = true; }
  // Erster Start: Startdaten
  const seed = { sessions: [{ date: today(), plan: "A", entries: { klimm: [{ w: 21, r: 10 }, { w: 21, r: 10 }, { w: 21, r: 8.5 }] } }] };
  store(KEY, seed);
  return seed;
}
let db = loadDb();
const persist = () => store(KEY, db);

let drafts = {};
try { drafts = JSON.parse(localStorage.getItem(DKEY)) || {}; } catch (e) { drafts = {}; }

/* ---------- Auswertung ---------- */
function sortedSessions() {
  return db.sessions.map((s, i) => [s, i]).sort((a, b) => a[0].date.localeCompare(b[0].date) || a[1] - b[1]).map(x => x[0]);
}
// Letzte Einheit mit dieser Übung (nicht am selben Tag derselben Einheit, nicht in der Zukunft)
function lastFor(id, date, plan) {
  let found = null;
  for (const s of sortedSessions()) {
    if (!s.entries[id] || s.date > date || (s.date === date && s.plan === plan)) continue;
    found = { date: s.date, sets: s.entries[id] };
  }
  return found;
}
function lastText(ex, last) {
  const s = last.sets, reps = s.map(x => fmt(x.r)).join(" / ");
  if (ex.kind === "time") return reps + " Sek.";
  const ws = s.map(x => x.w), same = ws.every(w => w === ws[0]);
  if (!same) return s.map(x => fmt(x.w) + "×" + fmt(x.r)).join(" · ") + " (kg × Wdh.)";
  if (ex.kind === "bw" && ws[0] === 0) return reps + " Wdh.";
  const unit = ex.kind === "assist" ? "kg Unterstützung" : ex.kind === "bw" ? "kg zusätzlich" : "kg";
  return fmt(ws[0]) + " " + unit + " · " + reps + " Wdh.";
}
function suggestion(ex, last) {
  if (!last || last.sets.length < ex.sets || !last.sets.every(s => s.r >= ex.max)) return null;
  if (ex.kind === "time")
    return { title: "Alle Sätze mit " + ex.max + " Sek. geschafft", text: "Nächste Stufe: länger halten oder die Position erschweren.", fill: null };
  const ws = last.sets.map(s => s.w);
  if (ex.kind === "assist") {
    const base = Math.min(...ws), lo = Math.max(0, round(base - 3)), hi = Math.max(0, round(base - 2));
    return { title: "Vorschlag heute: " + (lo === hi ? fmt(hi) : fmt(lo) + "–" + fmt(hi)) + " kg Unterstützung",
             text: "2–3 kg weniger als zuletzt – alle Sätze mit " + ex.max + " Wdh. geschafft.", fill: hi };
  }
  const base = Math.max(...ws), fill = round(base + 2.5);
  return { title: "Vorschlag heute: " + fmt(fill) + " kg" + (ex.kind === "bw" ? " zusätzlich" : ""),
           text: "+2,5 kg – alle Sätze mit " + ex.max + " Wdh. geschafft.", fill };
}

/* ---------- Ansichten ---------- */
const app = document.getElementById("app");
const backLink = (href, label) => h("a", { class: "back", href }, "‹ " + (label || "Zurück"));

function viewHome() {
  const sessions = sortedSessions();
  const planBtn = key => {
    const last = sessions.filter(s => s.plan === key).pop();
    return h("a", { class: "plan", href: "#/plan/" + key },
      h("b", null, PLANS[key].name),
      h("span", null, PLANS[key].ids.length + " Übungen" + (last ? " · zuletzt " + dmy(last.date) : " · noch nicht trainiert")));
  };
  const exLinks = key => h("div", { class: "list" }, PLANS[key].ids.map(id => {
    const n = sessions.filter(s => s.entries[id]).length;
    return h("a", { href: "#/ex/" + id }, EXERCISES[id].name, h("span", null, n + "×"));
  }));
  return h("div", null,
    h("h1", null, "Krafttraining"),
    h("p", { class: "muted" }, "Welche Einheit steht heute an?"),
    h("div", { class: "plans" }, planBtn("A"), planBtn("B")),
    h("h2", null, "Verlauf · Einheit A"), exLinks("A"),
    h("h2", null, "Verlauf · Einheit B"), exLinks("B"),
    h("h2", null, "Daten"),
    h("a", { class: "btn secondary", href: "#/daten" }, "Export / Import (Backup)"),
    memoryOnly ? h("p", { class: "small", style: "color:var(--danger);margin-top:12px" }, "Achtung: Der Browser erlaubt kein Speichern (privater Modus?). Daten gehen beim Schließen verloren.") : null);
}

function viewPlan(key) {
  const plan = PLANS[key];
  const draft = drafts[key] = drafts[key] || { date: today(), entries: {} };
  const saveDraft = () => { store(DKEY, drafts); };
  const dateIn = h("input", { type: "date", value: draft.date, "aria-label": "Datum", onchange: () => { if (DATE_RE.test(dateIn.value)) { draft.date = dateIn.value; saveDraft(); route(); } } });
  const refs = {}; // id -> [{w, r}] Eingabefelder

  const cards = plan.ids.map(id => {
    const ex = EXERCISES[id], noW = ex.kind === "time";
    const last = lastFor(id, draft.date, key), sug = suggestion(ex, last);
    const saved = draft.entries[id] || [];
    refs[id] = [];
    const sync = () => { draft.entries[id] = refs[id].map(r => [r.w ? r.w.value : "", r.r.value]); saveDraft(); };
    const rows = [];
    for (let i = 0; i < ex.sets; i++) {
      const lastSet = last && (last.sets[i] || last.sets[last.sets.length - 1]);
      const field = (ph, v, label) => h("input", { type: "text", inputmode: "decimal", autocomplete: "off", enterkeyhint: "next", placeholder: ph, value: v || "", "aria-label": label + " Satz " + (i + 1) + ", " + ex.name, oninput: e => { e.target.classList.remove("bad"); sync(); } });
      const ref = {};
      if (!noW) ref.w = field(lastSet ? toInput(lastSet.w) : "kg", saved[i] && saved[i][0], "Gewicht");
      ref.r = field(last && last.sets[i] ? toInput(last.sets[i].r) : (noW ? "Sek." : "Wdh."), saved[i] && saved[i][1], noW ? "Sekunden" : "Wiederholungen");
      refs[id].push(ref);
      rows.push(h("div", { class: "row" + (noW ? " single" : "") }, h("span", { class: "n" }, "Satz " + (i + 1)), ref.w, ref.r));
    }
    const wLabel = ex.kind === "assist" ? "Unterstützung kg" : ex.kind === "bw" ? "Zusatz kg" : "Gewicht kg";
    const fillWeights = v => { refs[id].forEach(r => { if (r.w) r.w.value = toInput(v); }); sync(); };
    const tools = last ? h("div", { class: "tools" },
      h("button", { class: "secondary small-btn", type: "button", onclick: () => {
        refs[id].forEach((r, i) => {
          const s = last.sets[i], base = last.sets[last.sets.length - 1];
          if (r.w) r.w.value = toInput((s || base).w);
          r.r.value = s ? toInput(s.r) : "";
        });
        sync(); toast("Werte vom letzten Mal übernommen");
      } }, "Wie letztes Mal")) : null;
    return h("section", { class: "card" },
      h("div", { class: "card-head" },
        h("div", null, h("h3", null, ex.name),
          h("div", { class: "spec" }, ex.sets + " × " + ex.min + "–" + ex.max + (noW ? " Sek." : " Wdh.") + (ex.note ? " " + ex.note : ""))),
        h("a", { class: "hist-link", href: "#/ex/" + id }, "Verlauf ›")),
      h("div", { class: "last" }, last ? "Letztes Mal (" + dmy(last.date) + "): " + lastText(ex, last) : "Noch keine Einträge"),
      sug ? h("div", { class: "suggest" }, h("b", null, sug.title), sug.text,
        sug.fill != null ? h("button", { type: "button", onclick: () => { fillWeights(sug.fill); toast("Vorschlag eingetragen"); } }, "Vorschlag übernehmen (" + fmt(sug.fill) + " kg)") : null) : null,
      noW ? null : h("div", { class: "cols" }, h("span"), h("span", null, wLabel), h("span", null, "Wdh.")),
      h("div", { class: "rows" }, rows),
      tools);
  });

  function save() {
    const date = dateIn.value;
    if (!DATE_RE.test(date)) { toast("Bitte ein Datum wählen"); return; }
    const entries = {};
    let problem = null;
    for (const id of plan.ids) {
      const ex = EXERCISES[id], sets = [];
      refs[id].forEach((r, i) => {
        const w = r.w ? parseNum(r.w.value) : null, rep = parseNum(r.r.value);
        const empty = (w === null || !r.w) && rep === null;
        if (empty) return;
        const wOptional = ex.kind === "bw" || !r.w;
        const bad = (r.w && Number.isNaN(w)) || Number.isNaN(rep) || rep === null || rep <= 0 || (w === null && !wOptional);
        if (bad) {
          if (!problem) problem = { msg: "Satz " + (i + 1) + " bei „" + ex.name + "“ ist unvollständig", el: (r.w && (Number.isNaN(w) || w === null) && !wOptional) ? r.w : r.r };
          (r.w || r.r).classList.add("bad"); r.r.classList.add("bad");
          return;
        }
        sets.push({ w: w === null ? 0 : w, r: rep });
      });
      if (sets.length) entries[id] = sets;
    }
    if (problem) { toast(problem.msg); problem.el.focus(); return; }
    if (!Object.keys(entries).length) { toast("Noch nichts eingetragen"); return; }
    let s = db.sessions.find(x => x.date === date && x.plan === key);
    if (s) Object.assign(s.entries, entries); else db.sessions.push({ date, plan: key, entries });
    persist();
    delete drafts[key]; saveDraft();
    location.hash = "#/";
    toast(plan.name + " gespeichert ✓");
  }

  return h("div", null,
    backLink("#/", "Start"),
    h("h1", null, plan.name),
    h("div", { class: "datebar" }, h("label", null, "Datum"), dateIn),
    cards,
    h("div", { class: "savebar" }, h("button", { type: "button", onclick: save }, plan.name + " speichern")));
}

function lineChart(points, unitLabel) {
  const NS = "http://www.w3.org/2000/svg";
  const W = 340, H = 190, L = 44, R = 16, T = 20, B = 28;
  const mk = (n, a, text) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (text != null) e.textContent = text; return e; };
  const svg = mk("svg", { viewBox: "0 0 " + W + " " + H, class: "chart", role: "img", "aria-label": "Liniendiagramm " + unitLabel });
  const vals = points.map(p => p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi) { lo -= 1; hi += 1; } else { const pad = (hi - lo) * 0.15; lo -= pad; hi += pad; }
  lo = Math.max(0, lo);
  const x = i => points.length === 1 ? L + (W - L - R) / 2 : L + i * (W - L - R) / (points.length - 1);
  const y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  [lo, (lo + hi) / 2, hi].forEach(v => {
    svg.append(mk("line", { class: "grid", x1: L, x2: W - R, y1: y(v), y2: y(v) }));
    svg.append(mk("text", { x: L - 6, y: y(v) + 3.5, "text-anchor": "end" }, fmt1(v)));
  });
  svg.append(mk("polyline", { class: "line", points: points.map((p, i) => x(i) + "," + y(p.v)).join(" ") }));
  points.forEach((p, i) => svg.append(mk("circle", { class: "dot", cx: x(i), cy: y(p.v), r: 4 })));
  const lastI = points.length - 1;
  svg.append(mk("text", { class: "val", x: Math.min(x(lastI), W - R - 8), y: y(points[lastI].v) - 10, "text-anchor": lastI === 0 ? "middle" : "end" }, fmt(points[lastI].v) + " " + unitLabel));
  const lab = (i, anchor) => svg.append(mk("text", { x: x(i), y: H - 8, "text-anchor": anchor }, dm(points[i].date)));
  if (points.length === 1) lab(0, "middle"); else { lab(0, "start"); lab(lastI, "end"); }
  return svg;
}

function viewExercise(id) {
  const ex = EXERCISES[id];
  if (!ex) return viewHome();
  const time = ex.kind === "time";
  const rows = sortedSessions().filter(s => s.entries[id]).map(s => ({ s, sets: s.entries[id] }));
  const points = rows.map(r => ({ date: r.s.date, v: time ? Math.max(...r.sets.map(x => x.r)) : Math.max(...r.sets.map(x => x.w)) }));
  const unitLabel = time ? "Sek." : "kg";
  const chartTitle = time ? "Beste Haltezeit" : ex.kind === "assist" ? "Unterstützung (kg)" : ex.kind === "bw" ? "Zusatzgewicht (kg)" : "Gewicht (kg)";

  const remove = (s) => {
    if (!confirm("Eintrag vom " + dmy(s.date) + " (" + ex.name + ") löschen?")) return;
    delete s.entries[id];
    if (!Object.keys(s.entries).length) db.sessions = db.sessions.filter(x => x !== s);
    persist(); route();
  };
  const table = rows.length ? h("table", null,
    h("thead", null, h("tr", null, h("th", null, "Datum"), time ? null : h("th", null, "Gewicht"), h("th", null, time ? "Sekunden" : "Wdh."), h("th"))),
    h("tbody", null, rows.slice().reverse().map(({ s, sets }) => {
      const ws = sets.map(x => x.w), same = ws.every(w => w === ws[0]);
      const wText = same ? fmt(ws[0]) + " kg" : ws.map(fmt).join(" / ") + " kg";
      return h("tr", null, h("td", null, dmy(s.date)),
        time ? null : h("td", null, wText),
        h("td", null, sets.map(x => fmt(x.r)).join(" / ")),
        h("td", { class: "x" }, h("button", { type: "button", "aria-label": "Eintrag vom " + dmy(s.date) + " löschen", onclick: () => remove(s) }, "✕")));
    }))) : h("p", { class: "muted" }, "Noch keine Einträge für diese Übung.");

  return h("div", null,
    backLink("#/", "Start"),
    h("h1", null, ex.name),
    h("p", { class: "muted" }, ex.sets + " × " + ex.min + "–" + ex.max + (time ? " Sek." : " Wdh.") + (ex.note ? " " + ex.note : "")),
    h("h2", null, chartTitle),
    h("div", { class: "card" }, points.length ? lineChart(points, unitLabel) : h("p", { class: "muted" }, "Das Diagramm erscheint nach dem ersten Speichern.")),
    h("h2", null, "Einträge"),
    h("div", { class: "card" }, table));
}

function viewData() {
  const count = db.sessions.length;
  const fileIn = h("input", { type: "file", accept: "application/json,.json", style: "display:none", onchange: e => importFile(e.target.files[0], e.target) });
  return h("div", null,
    backLink("#/", "Start"),
    h("h1", null, "Daten"),
    h("p", { class: "muted" }, count + " gespeicherte Einheit" + (count === 1 ? "" : "en") + ". Die Daten liegen nur in diesem Browser auf diesem Gerät. Mach regelmäßig ein Backup."),
    h("div", { class: "stack" },
      h("button", { type: "button", onclick: exportData }, "Backup exportieren (JSON)"),
      h("button", { type: "button", class: "secondary", onclick: () => fileIn.click() }, "Backup importieren"),
      fileIn),
    h("p", { class: "small muted", style: "margin-top:12px" }, "Beim Import werden Einheiten gleichen Datums überschrieben, alle anderen bleiben erhalten."),
    h("h2", null, "Zurücksetzen"),
    h("button", { type: "button", class: "danger", onclick: () => {
      if (!confirm("Wirklich ALLE Trainingsdaten löschen? Das lässt sich nicht rückgängig machen.")) return;
      db = { sessions: [] }; drafts = {}; persist(); store(DKEY, drafts); toast("Alle Daten gelöscht"); route();
    } }, "Alle Daten löschen"));
}

function exportData() {
  const payload = { app: "krafttraining", version: 1, exported: new Date().toISOString(), sessions: sortedSessions() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = h("a", { href: url, download: "krafttraining-" + today() + ".json" });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  toast("Backup erstellt");
}
function importFile(file, input) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try { parsed = sanitize(JSON.parse(reader.result)); } catch (e) { toast("Datei konnte nicht gelesen werden"); input.value = ""; return; }
    if (!parsed.sessions.length) { toast("Keine gültigen Einheiten in der Datei"); input.value = ""; return; }
    if (!confirm(parsed.sessions.length + " Einheiten importieren? Einheiten mit gleichem Datum werden überschrieben.")) { input.value = ""; return; }
    const keys = new Set(parsed.sessions.map(s => s.date + s.plan));
    db.sessions = db.sessions.filter(s => !keys.has(s.date + s.plan)).concat(parsed.sessions);
    persist(); toast("Import abgeschlossen ✓"); route();
  };
  reader.onerror = () => toast("Datei konnte nicht gelesen werden");
  reader.readAsText(file);
}

/* ---------- Router ---------- */
function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/");
  let view;
  if (parts[0] === "plan" && PLANS[parts[1]]) view = viewPlan(parts[1]);
  else if (parts[0] === "ex" && EXERCISES[parts[1]]) view = viewExercise(parts[1]);
  else if (parts[0] === "daten") view = viewData();
  else view = viewHome();
  app.replaceChildren(view);
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();

/* Icon für den Home-Bildschirm (iOS braucht ein PNG) */
try {
  const c = document.createElement("canvas"); c.width = c.height = 180;
  const g = c.getContext("2d");
  g.fillStyle = "#0f766e"; g.fillRect(0, 0, 180, 180);
  g.strokeStyle = "#fff"; g.lineWidth = 14; g.lineCap = "round";
  g.beginPath(); [[40, 74, 40, 106], [58, 56, 58, 124], [122, 56, 122, 124], [140, 74, 140, 106], [58, 90, 122, 90]]
    .forEach(l => { g.moveTo(l[0], l[1]); g.lineTo(l[2], l[3]); });
  g.stroke();
  document.head.append(h("link", { rel: "apple-touch-icon", href: c.toDataURL("image/png") }));
} catch (e) { /* Icon ist optional */ }
</script>
